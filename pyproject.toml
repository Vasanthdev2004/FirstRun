[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "firstrun"
version = "0.1.0"
description = "Trustworthy local setup verification engine for FirstRun"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
github = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "PyJWT[crypto]==2.13.0",
]
provider = [
  "boto3==1.43.91",
  "strands-agents==1.55.1",
]

[project.scripts]
firstrun = "firstrun.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/firstrun"]

[tool.uv]
default-groups = []
required-version = "==0.12.9"
